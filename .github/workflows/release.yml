name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.23"
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.target.runs-on }}
    strategy:
      matrix:
        target:
          - name: linux-amd64
            runs-on: ubuntu-latest
          - name: linux-aarch64
            runs-on: ubuntu-latest
          - name: darwin-arm64
            runs-on: macos-14
      fail-fast: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Prepare for build
        run: |
          bazel/setup-ci.sh
          mkdir -p editors/code/dist
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build
        run: bazel build -c opt ${{ matrix.target.name == 'linux-aarch64' && '--platforms @zig_sdk//platform:linux_arm64' || '' }} //crates/starpls
      - name: Stage artifact
        run: |
          mkdir -p dist
          platform_flags="${{ matrix.target.name == 'linux-aarch64' && '--platforms @zig_sdk//platform:linux_arm64' || '' }}"
          output="$(bazel cquery -c opt $platform_flags //crates/starpls:starpls --output=files)"
          install -m 0755 "$(bazel info execution_root)/$output" dist/starpls
      - uses: actions/upload-artifact@v4
        with:
          name: starpls-${{ matrix.target.name }}
          path: dist/starpls

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: starpls-linux-aarch64
          path: artifacts/linux-aarch64
      - name: Download linux amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: starpls-linux-amd64
          path: artifacts/linux-amd64
      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: starpls-darwin-arm64
          path: artifacts/darwin-arm64
      - name: Prepare release artifacts
        run: |
          mkdir -p release

          install -m 0755 "$(find artifacts/linux-aarch64 -type f -name starpls -print -quit)" release/starpls-linux-aarch64
          install -m 0755 "$(find artifacts/linux-amd64 -type f -name starpls -print -quit)" release/starpls-linux-amd64
          install -m 0755 "$(find artifacts/darwin-arm64 -type f -name starpls -print -quit)" release/starpls-darwin-arm64
          chmod +x release/starpls-*

          # Also create archives for usage by installation methods like Homebrew.
          # Eventually, we'll remove the non-zipped binaries above.
          cd release
          cp starpls-linux-aarch64 starpls && tar -czvf starpls-linux-aarch64.tar.gz starpls && rm starpls
          cp starpls-linux-amd64 starpls && tar -czvf starpls-linux-amd64.tar.gz starpls && rm starpls
          cp starpls-darwin-arm64 starpls && tar -czvf starpls-darwin-arm64.tar.gz starpls && rm starpls
      - name: Show release artifacts
        run: find release
      - name: Create release
        run: |
          gh release create "$RELEASE_TAG" release/* --title "$RELEASE_TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
